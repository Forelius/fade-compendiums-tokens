name: Build and Release fade-compendiums-tokens

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.release.target_commitish == 'main' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Substitute Manifest and Download URLs in the module.json
      - name: Substitute Manifest and Download Links For Versioned Ones
        id: sub_manifest_link_version
        uses: microsoft/variable-substitution@v1
        with:
          files: 'module.json'
        env:
          version: ${{github.event.release.tag_name}}
          manifest: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.json
          download: https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zip

      - name: Fetch all branches and tags
        run: git fetch --all --tags

      - name: Check if the tag commit is in the main branch
        id: check_main
        run: |
          TAG_COMMIT=$(git rev-parse ${{ env.VERSION }})
          if git merge-base --is-ancestor $TAG_COMMIT origin/main; then
            echo "The tag is in the main branch history."
            echo "is_valid=true" >> $GITHUB_ENV
          else
            echo "The tag (${{ env.VERSION }}) is NOT in the main branch history. Skipping release."
            echo "is_valid=false" >> $GITHUB_ENV
          fi

      - name: Prepare release zip
        if: env.is_valid == 'true'
        run: |
          zip -r module.zip ./* \
            -x '.git*' \
            -x '.github/*' \
            -x 'node_modules/*' \
            -x 'scripts/*' \
            -x 'aliases.json' \
            -x 'names.txt' \
            -x 'overrides.json' \
            -x 'package.json' \
            -x 'package-lock.json' \
            -x '.vscode/*' \

      # Prepare release notes
      - name: Prepare release notes
        id: prepare_notes
        run: |
          echo "" >> release_notes.txt
          echo ${{ github.event.release.body }} >> release_notes.txt
          echo "To install manually, use this URL:" >> release_notes.txt
          echo "https://github.com/${{github.repository}}/releases/download/latest/module.json" >> release_notes.txt

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          bodyfile: release_notes.txt

      # Update the 'latest' release
      - name: Create Release
        id: create_latest_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: Latest
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json,./module.zip'
          tag: latest
          bodyfile: release_notes.txt
          
      # Not publishing to Foundry's package directory yet (pending approval).
      # - name: Publish Module to FoundryVTT Website
      #   if: env.is_valid == 'true' && !github.event.release.unpublished && !github.event.release.prerelease
      #   uses: cs96and/FoundryVTT-release-package@v1
      #   with:
      #     package-token: ${{ secrets.FOUNDRY_PACKAGE_TOKEN }}
      #     manifest-url: https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/module.json
